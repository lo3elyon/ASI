<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#041021"/><stop offset=".55" stop-color="#07111f"/><stop offset="1" stop-color="#062a2a"/></linearGradient>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#14b8a6"><animate attributeName="stop-color" values="#14b8a6;#22d3ee;#f59e0b;#14b8a6" dur="8s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#f59e0b;#10b981;#22d3ee" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#f59e0b"><animate attributeName="stop-color" values="#f59e0b;#10b981;#14b8a6;#f59e0b" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
<radialGradient id="glow" cx=".78" cy=".45" r=".45"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx=".15" cy=".9" r=".4"><stop offset="0" stop-color="#f59e0b" stop-opacity=".25"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
</defs>
<style>
.p{animation:tw 4s ease-in-out infinite} .p1{animation-delay:.6s} .p2{animation-delay:1.2s} .p3{animation-delay:1.8s} .p4{animation-delay:2.4s} .p5{animation-delay:3s}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.ln{stroke:#14b8a6;stroke-opacity:.18;stroke-width:1;stroke-dasharray:6 8;animation:dash 12s linear infinite}
@keyframes dash{to{stroke-dashoffset:-280}}
.orb{animation:pulse 5s ease-in-out infinite;transform-origin:940px 150px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
.ring{fill:none;stroke-width:2;transform-origin:940px 150px;animation:spin 18s linear infinite}
.r2{animation-duration:26s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.t{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;}
.sub{animation:fade 9s infinite;opacity:0} .s2{animation-delay:3s} .s3{animation-delay:6s}
@keyframes fade{0%{opacity:0;transform:translateY(8px)}5%,30%{opacity:1;transform:none}36%,100%{opacity:0}}
.bar{animation:grow 3s ease-out infinite alternate}
@keyframes grow{from{width:40px}to{width:360px}}
</style>
